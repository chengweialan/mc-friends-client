name: Fast multipart client mirror
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['publish-clients-multipart.py', '.github/workflows/multipart-clients.yml']
permissions:
  contents: read
concurrency:
  group: multipart-client-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Get published archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "v$(cat CLIENT-VERSION)" --dir dist --pattern '*.zip' --pattern SHA256SUMS.txt
          python3 -m pip install 'cos-python-sdk-v5>=1.9,<2'
      - name: Parallel multipart upload
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: python3 publish-clients-multipart.py
