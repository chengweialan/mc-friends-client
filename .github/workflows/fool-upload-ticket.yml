name: Prepare Fool owner upload
on:
  push:
    branches: [main]
    paths: [upload-request.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install 'cos-python-sdk-v5>=1.9,<2' 'cryptography>=43,<47'
      - name: Issue encrypted upload ticket
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: python3 tools/cos-upload-ticket.py
