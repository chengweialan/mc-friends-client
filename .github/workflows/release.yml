name: Build Windows and macOS clients
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: client-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build client bundles
        run: |
          python3 build-release.py
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '\r\n' < CLIENT-VERSION)
          gh release create "v$VERSION" dist/FriendsMC-Windows-x64.zip dist/FriendsMC-UI-Update.zip dist/FriendsMC-macOS-arm64.zip dist/FriendsMC-macOS-x64.zip dist/FriendsMC-macOS-Update.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Friends MC $VERSION — Windows + macOS" --notes-file RELEASE-NOTES.md
